services:
  games:
    build: .
    image: rediff-games:local
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      KEYCLOAK_ISSUER_URL: http://auth.localhost:8081/realms/games
    depends_on:
      - oauth2-proxy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://auth.localhost:8081/realms/games
      OAUTH2_PROXY_CLIENT_ID: games-web
      OAUTH2_PROXY_CLIENT_SECRET: ${GAMES_WEB_CLIENT_SECRET:?Run python3 scripts/setup-local-auth.py first}
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:8080/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?Run python3 scripts/setup-local-auth.py first}
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_PATH: /
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SCOPE: "openid profile email"
      OAUTH2_PROXY_UPSTREAMS: static://200
      OAUTH2_PROXY_WHITELIST_DOMAINS: localhost:8080,auth.localhost:8081
    depends_on:
      keycloak:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run python3 scripts/setup-local-auth.py first}
      KC_HTTP_PORT: "8081"
      KC_HOSTNAME: http://auth.localhost:8081
      GAMES_WEB_CLIENT_SECRET: ${GAMES_WEB_CLIENT_SECRET:?Run python3 scripts/setup-local-auth.py first}
      AUTHENTIK_GAMES_CLIENT_SECRET: ${AUTHENTIK_GAMES_CLIENT_SECRET:?Run python3 scripts/setup-local-auth.py first}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 24
    volumes:
      - ./auth/games-realm.json:/opt/keycloak/data/import/games-realm.json:ro
    networks:
      default:
        aliases:
          - auth.localhost

  authentik-postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?Run python3 scripts/setup-local-auth.py first}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - authentik-database:/var/lib/postgresql/data

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.5
    command: server
    restart: unless-stopped
    environment: &authentik-environment
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?Run python3 scripts/setup-local-auth.py first}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Run python3 scripts/setup-local-auth.py first}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_ADMIN_PASSWORD:?Run python3 scripts/setup-local-auth.py first}
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@example.test
      AUTHENTIK_GAMES_CLIENT_SECRET: ${AUTHENTIK_GAMES_CLIENT_SECRET:?Run python3 scripts/setup-local-auth.py first}
      MOCK_ALICE_PASSWORD: ${MOCK_ALICE_PASSWORD:?Run python3 scripts/setup-local-auth.py first}
      MOCK_BOB_PASSWORD: ${MOCK_BOB_PASSWORD:?Run python3 scripts/setup-local-auth.py first}
    ports:
      - "9000:9000"
    depends_on:
      authentik-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/-/health/ready/', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s
    networks:
      default:
        aliases:
          - sso.localhost

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.5
    command: worker
    restart: unless-stopped
    environment: *authentik-environment
    depends_on:
      authentik-postgres:
        condition: service_healthy
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro

volumes:
  authentik-database:
