services:
  games:
    build: .
    image: rediff-games:local
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - auth-backend

  auth-backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      AUTH_MODE: stub
      AUTH_COOKIE_NAMES: games_dev_session
    # Private to the Compose network; browsers access it through NGINX.

# Retained so an existing Authentik database is not removed during migration.
volumes:
  authentik-database:
