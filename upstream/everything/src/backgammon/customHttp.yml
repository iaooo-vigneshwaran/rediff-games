# AWS Amplify Hosting custom HTTP headers (applied to the deployed site).
#
# The script-src hashes cover the two inline scripts in index.html (theme
# resolution, then the Plausible queue stub). Vite copies them into the build
# verbatim, so a hash only changes when its script's text changes. Recompute
# them with:
#   npm run build && python3 -c "import re,hashlib,base64;[print('sha256-'+base64.b64encode(hashlib.sha256(s.encode()).digest()).decode()) for s in re.findall(r'<script>(.*?)</script>',open('dist/index.html').read(),re.S)]"
# (The JSON-LD block is a non-executing data block; CSP does not apply to it.)
customHeaders:
  - pattern: '**'
    headers:
      # Multiplayer uses a native WebRTC data channel and manual signaling.
      # No Puter SDK, API, WebSocket signaling, STUN, or TURN service is used.
      # Plausible remains the existing analytics provider. Inline styles are
      # used by board rendering and animations. Embedding policy is unchanged.
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' https://plausible.io 'sha256-v7136Z35nIU0KjaihRH6no7bcvyaZAOfuwZKn+G2HqU=' 'sha256-s3GjtVo80AO5y21xNb09L193qY2mDVWzcLbCiBHrn4s='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://plausible.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors *; upgrade-insecure-requests"
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
